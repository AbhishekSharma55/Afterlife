name: Backend checks
on:
  pull_request:
    paths: ['apps/server/**', 'packages/shared/**', 'docs/afterlife/fixtures/**', 'scripts/**', 'package*.json', '.github/workflows/backend.yml']
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: afterlife-test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run fixtures -- --check
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:afterlife-test@localhost:5432/postgres
      - name: Rehearse two episodes across a process restart
        run: npm run smoke:rehearsal
        timeout-minutes: 3
        env:
          TEST_DATABASE_URL: postgresql://postgres:afterlife-test@localhost:5432/postgres
